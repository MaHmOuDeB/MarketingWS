services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      APP_API_KEY: ${APP_API_KEY:-}
      PORT: "8501"
    depends_on:
      api:
        condition: service_healthy
