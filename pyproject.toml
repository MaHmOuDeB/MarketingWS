[project]
name = "marketing-content-generator"
version = "2.0.0"
description = "Generate, refine and translate marketing copy with an LLM (FastAPI + Streamlit)."
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
