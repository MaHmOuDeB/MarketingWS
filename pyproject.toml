[project]
name = "marketing-content-generator"
version = "2.1.0"
description = "Generate, refine and translate marketing copy with an LLM (FastAPI + web UI + Streamlit)."
requires-python = ">=3.12"
# runtime dependencies of the web deployment (Vercel installs these); keep in sync with backend/requirements.txt
dependencies = [
    "fastapi==0.128.8",
    "pydantic==2.13.5",
    "openai==2.48.0",
    "anthropic==0.125.0",
]

[tool.vercel]
entrypoint = "server:app"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
